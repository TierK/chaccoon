<div class="brand-name">
    <img src="/assets/images/brand-name.png" alt="Chaccoon">
</div>
<form
    class="login-form" 
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
>
    <h1 class="h1">Login</h1>

    <label class="cc-control-label mb-16">
        Username
        <br>
        <input
            formControlName="username"
            type="text" placeholder="Type Your Username" class="cc-input">
    </label>
    <label class="cc-control-label mb-32">
  Password
  <br>
  <div class="password-input">
    <input
      formControlName="password"
      [type]="isPassswordVisible() ? 'text' : 'password'"
      placeholder="Type Your Password"
      class="cc-input"
    >
<button
  type="button"
  class="password-eye-btn"
  (click)="togglePasswordVisibility()"
>
  <div class="eye-icon" [ngClass]="{ visible: !isPassswordVisible() }">
    <svg xmlns="http://www.w3.org/2000/svg" height="24" width="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 6a9.77 9.77 0 0 1 8.94 6A9.77 9.77 0 0 1 12 18a9.77 9.77 0 0 1-8.94-6A9.77 9.77 0 0 1 12 6m0-2C6.5 4 1.73 7.61.11 12c1.62 4.39 6.39 8 11.89 8s10.27-3.61 11.89-8C22.27 7.61 17.5 4 12 4Zm0 5a3 3 0 0 1 3 3c0 .53-.15 1.02-.41 1.44l3.38 3.38-1.42 1.42-3.38-3.38A3 3 0 0 1 9 12c0-.53.15-1.02.41-1.44L6.03 7.18 7.45 5.76l3.38 3.38A3 3 0 0 1 12 9Z"/>
      <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"/>
    </svg>
  </div>
  <div class="eye-icon" [ngClass]="{ visible: isPassswordVisible() }">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="24" height="24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 4.5C7.305 4.5 3.28 7.362 1.5 12c1.78 4.638 5.805 7.5 10.5 7.5s8.72-2.862 10.5-7.5C20.72 7.362 16.695 4.5 12 4.5zM12 15a3 3 0 100-6 3 3 0 000 6z" />
    </svg>
  </div>
</button>
  </div>
</label>

    <div *ngIf="loginError" class="error-message login-error">
      {{ loginError }}
    </div>
    <button class="btn" type="submit">
        Shoot
    </button>
</form>
<img src="/assets/images/logo.png" class="logo-raccoon" alt="logo-raccoon">
<footer class="app-footer">
  <small>v{{ environment.version }} – built on {{ environment.buildTime | date:'yyyy-MM-dd HH:mm' }}</small>
</footer>
